# ===============================================================
# ms-seguimiento - configuración
# Los valores entre ${...} se leen de variables de entorno; lo que
# va después de ":" es el valor por defecto para desarrollo local.
# ===============================================================
spring.application.name=ms-seguimiento
server.port=${SERVER_PORT:8084}

# ---------------------------------------------------------------
# Base de datos MySQL (Amazon RDS en AWS o MySQL local con Docker)
# Cada microservicio usa su propio esquema: seguimiento_db
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:seguimiento_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:ms_seguimiento}
spring.datasource.password=${DB_PASSWORD:ms_seguimiento_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP (punto crítico identificado en el diseño)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
# update: crea y ajusta las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# JSON
# ---------------------------------------------------------------
spring.jackson.time-zone=America/Santiago
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------
# Monitoreo y documentación
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.swagger-ui.path=/swagger-ui.html
