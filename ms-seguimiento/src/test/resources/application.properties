# Perfil de pruebas: H2 en memoria en modo MySQL, no requiere servidor de base de datos
spring.datasource.url=jdbc:h2:mem:seguimiento_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
