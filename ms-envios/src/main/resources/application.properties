# ===============================================================
# ms-envios - configuración
# Los valores entre ${...} se leen de variables de entorno; lo que
# va después de ":" es el valor por defecto para desarrollo local.
# ===============================================================
spring.application.name=ms-envios
server.port=${SERVER_PORT:8082}

# ---------------------------------------------------------------
# Base de datos MySQL (Amazon RDS en AWS o MySQL local con Docker)
# Cada microservicio usa su propio esquema: envios_db
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:envios_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:ms_envios}
spring.datasource.password=${DB_PASSWORD:ms_envios_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP (punto crítico identificado en el diseño)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
# update: crea y ajusta las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# Integración con ms-transportistas (REST + Circuit Breaker)
# ---------------------------------------------------------------
transportistas.url=${TRANSPORTISTAS_URL:http://localhost:8083}
transportistas.timeout-ms=2000

# Se abre el circuito si el 50% de las últimas 10 llamadas fallan;
# queda abierto 15 s y luego deja pasar 3 llamadas de prueba.
resilience4j.circuitbreaker.instances.transportistas.sliding-window-size=10
resilience4j.circuitbreaker.instances.transportistas.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.transportistas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transportistas.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.transportistas.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.transportistas.register-health-indicator=true
management.health.circuitbreakers.enabled=true

# ---------------------------------------------------------------
# JSON
# ---------------------------------------------------------------
spring.jackson.time-zone=America/Santiago
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------
# Monitoreo y documentación
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.swagger-ui.path=/swagger-ui.html
